<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel='shortcut icon' href='/favicon.png' type='image/x-icon' />
    <link rel="stylesheet" href="/style.css">
    <title>TurboWarp Extensions - R3d5t0n3_GUY</title>
  </head>
  <body>
    <a href="/index.html">Return Home</a><br>
    <h1>TURBOWARP EXTENSIONS</h1>
    <br>
    <p>
      These are the extensions I have made for <a href="https://turbowarp.org/editor" target="_blank">TurboWarp</a>.
    </p>
    <ul id="extension-list"></ul>
    <script>
      let text=''
      const links = [
        { src: "ProjectFullscreen", text: "Project Fullscreen (my first)" },
        { src: "lPlusRatio", text: "L+ Ratio (some Math constants)" },
        { src: "TempLists", text: "Temporary Lists (an addon for LilyMakesThings' <em>Temporary Variables</em>)", docs: "'Temporary Lists' Documentation" },
        { src: "WebStorage", text: "A simple extension for using the localStorage API." },
      ]
      links.forEach(i => {
        if (typeof(i) === "string") {
          text += `<li>${i}</li>\n`
        } else {
          text += `<li><a href="src/${i.src}.js" target="_blank">${i.text}</a>`
          if ("docs" in i) {
            text += `\n<br><small><a href="docs/${i.docs}.sb3" target="_blank">DOCUMENTATION</a></small>\n`
          }
          text += `</li>\n`
        }
      })
      document.getElementById('extension-list').innerHTML = text
    </script>
  </body>
</html>
